# Shared tool configuration. Runtime dependencies are pinned per service
# (services/<name>/requirements.txt); dev tools are pinned in requirements/dev.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "infra", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
