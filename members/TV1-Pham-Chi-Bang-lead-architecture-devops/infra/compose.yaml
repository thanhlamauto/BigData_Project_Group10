# StreamRAG — local development stack (Milestone 1).
# Run via the Makefile in the TV1 folder (`make up`), which passes `--env-file .env`.
# Application services (spark job, indexer, api) are added by their owners in M1.2.

name: streamrag

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: streamrag-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "streamrag-local-kraft-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers (kafka:29092) · EXTERNAL: the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Topics are created explicitly by `make init` (owner: TV2), never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  minio:
    # Official minio/minio images are no longer published; this is a pinned community build
    # of the same server (see docs/adr/0001-kappa-stack.md).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: streamrag-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  minio-init:
    # One-shot job: creates the data lake bucket if it does not exist yet.
    # Kept out of `up --wait` (an exited container fails the wait); run via `make init-bucket`.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      LAKE_BUCKET: ${LAKE_BUCKET:-streamrag-lake}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" > /dev/null &&
        mc mb --ignore-existing "local/$$LAKE_BUCKET" &&
        mc ls local
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    container_name: streamrag-opensearch
    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      # LOCAL DEVELOPMENT ONLY: security plugin disabled, plain HTTP, no auth.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  opensearch-data:
