name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dev tools
        run: python -m pip install -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Unit tests
        run: python -m pytest tests/unit

  compose-config:
    # Validates infra/compose.yaml syntax and interpolation only; the full stack runs locally (make up).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example -f infra/compose.yaml --profile init config --quiet
