name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Tooling (pyproject, dev requirements, compose) lives in the TV1 folder.
  TV1_DIR: members/TV1-Pham-Chi-Bang-lead-architecture-devops

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: members/TV1-Pham-Chi-Bang-lead-architecture-devops/requirements/*.txt

      - name: Install dev tools
        run: python -m pip install -r "$TV1_DIR/requirements/dev.txt"

      - name: Lint
        run: python -m ruff check --config "$TV1_DIR/pyproject.toml" .

      - name: Format check
        run: python -m ruff format --config "$TV1_DIR/pyproject.toml" --check .

      - name: Unit tests
        run: |
          paths=$(ls -d tests members/*/tests 2>/dev/null || true)
          python -m pytest -c "$TV1_DIR/pyproject.toml" --rootdir . $paths

  compose-config:
    # Validates the TV1 compose file syntax and interpolation only; the full stack runs locally (make up).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file "$TV1_DIR/.env.example" -f "$TV1_DIR/infra/compose.yaml" --profile init config --quiet
